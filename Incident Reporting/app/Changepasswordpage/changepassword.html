<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password – S.I.R</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="changepassword.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul>
      <li><a href="../mainhomepage/index.html#hero">Home</a></li>
      <li><a href="../mainhomepage/index.html#about">About</a></li>
      <li><a href="../usercontent/user-content.html">Dashboard</a></li>
    </ul>
  </nav>

  <!-- Section with background + overlay -->
  <section class="section">
    <div class="overlay"></div>

    <!-- Change Password Form -->
    <div class="form-container">
      <h2>Change Password</h2>
      <form id="changePasswordForm">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" required />

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required />

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" required />

        <button type="submit">Update Password</button>
      </form>
      <p id="message" class="message"></p>
    </div>
  </section>

  <script>
    const form = document.getElementById('changePasswordForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';
      message.className = 'message';

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        message.textContent = "New passwords do not match.";
        message.classList.add('error');
        return;
      }

      try {
        const response = await fetch("http://localhost:5000/user/change-password", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ currentPassword, newPassword })
        });

        if (response.ok) {
          message.textContent = "Password updated successfully.";
          message.classList.add('success');
          form.reset();
        } else {
          const data = await response.json();
          message.textContent = data.message || "Failed to update password.";
          message.classList.add('error');
        }
      } catch (err) {
        message.textContent = "An error occurred. Please try again.";
        message.classList.add('error');
      }
    });
  </script>

</body>
</html>
