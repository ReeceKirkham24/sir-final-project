<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password – S.I.R</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="changepassword.css" />
  <script defer src="changepassword.js"></script>

</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <ul>
      <li><a href="../mainhomepage/index.html#hero">Home</a></li>
      <li><a href="../mainhomepage/index.html#about">About</a></li>
      <li><a href="../usercontent/user-content.html">Dashboard</a></li>
    </ul>
  </nav>

  <!-- Section with background + overlay -->
  <section class="section">
    <div class="overlay"></div>

    <!-- Change Password Form -->
    <div class="form-container">
      <h2>Change Password</h2>
      <form id="changePasswordForm">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" required />

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required />

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" required />

        <button type="submit">Update Password</button>
      </form>
      <p id="message" class="message"></p>
    </div>
  </section>
  
</body>
</html>
